name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./Frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./Frontend

      - name: Run tests
        run: npm test 
        working-directory: ./Frontend

      - name: Build the React app
        run: npm run build
        working-directory: ./Frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: React-build
          path: Frontend/build

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: React-build
          path: Frontend/build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/Springboot-Frontend-react-app:latest -f Frontend/Dockerfile ./Frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/Springboot-Frontend-react-app:latest
