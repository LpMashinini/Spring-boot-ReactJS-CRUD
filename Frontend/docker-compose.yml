services:

  Employee_backend:
    build: 
      context: ../Backend
      dockerfile: Dockerfile
    image: lebogangmashinini9611/springboot-react-fullstack:latest
    container_name: Employee_backend
    ports:
      - "8080:8080"
    volumes:
      - ./Backend:/Backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://Employee_mysql:3306/employee_management_system
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - Employee_mysql

  Employee_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lebogangmashinini9611/springboot-frontend-react-app:latest
    container_name: Employee_frontend
    ports:
      - "80:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html
    depends_on:
      - Employee_backend

  Employee_mysql:
    image: mysql:8.0
    container_name: Employee_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_management_system
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
